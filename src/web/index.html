<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>Auto</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="rail-head">
      <span class="brand">Auto</span>
      <button id="new-session" class="icon" title="New session">+</button>
    </div>
    <div id="session-list"></div>
    <div class="rail-foot">
      <span id="conn" class="dot"></span><span id="conn-label">connecting</span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="rail-toggle" class="icon" title="Sessions">☰</button>
      <div class="titles">
        <h1 id="session-title">—</h1>
        <span id="session-folder"></span>
      </div>
      <select id="mode" title="Agent mode">
        <option value="agent">Agent</option>
        <option value="plan">Plan</option>
        <option value="ask">Ask</option>
      </select>
      <select id="policy" title="Approval policy">
        <option value="ask">Ask every time</option>
        <option value="ask-on-write">Ask before writes</option>
        <option value="auto">Auto-approve</option>
      </select>
      <span id="status" class="chip">idle</span>
      <button id="term-toggle" class="icon" title="Terminals">▤</button>
    </header>

    <div id="transcript"></div>

    <section id="terminals" hidden>
      <div class="term-bar">
        <div id="term-tabs"></div>
        <button id="term-new" class="icon" title="New terminal">+</button>
        <button id="term-hide" class="icon" title="Hide terminals">▾</button>
      </div>
      <div id="term-panes"></div>
    </section>

    <footer id="composer">
      <textarea id="box" rows="1" placeholder="Message the agent…"></textarea>
      <div class="actions">
        <button id="stop" class="danger" hidden>Stop</button>
        <button id="send" class="primary">Send</button>
      </div>
    </footer>
  </main>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>

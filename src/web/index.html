<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0b0d12" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Auto" />
<title>Auto</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/style.css" />
<script>
  // Before first paint, so a light-theme phone never flashes a dark page,
  // and an installed app does not lay out at 100dvh (too tall on iOS).
  try {
    const pref = localStorage.getItem('auto.theme') || 'system';
    const light = pref === 'light'
      || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    const theme = document.querySelector('meta[name="theme-color"]');
    if (theme) theme.setAttribute('content', light ? '#ffffff' : '#0b0d12');
    if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.dataset.standalone = '';
    }
    const vv = window.visualViewport;
    if (vv) {
      document.documentElement.style.setProperty('--vv-top', `${Math.round(vv.offsetTop)}px`);
      document.documentElement.style.setProperty('--vv-height', `${Math.round(vv.height)}px`);
    }
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="rail-head">
      <span class="brand">Auto</span>
      <button id="new-session" class="icon" title="New session">+</button>
      <button id="rail-close" class="icon" title="Close sessions" aria-label="Close sessions">×</button>
    </div>
    <div id="session-list"></div>
    <div class="rail-foot">
      <div class="rail-status">
        <span id="conn" class="dot"></span><span id="conn-label">connecting</span>
      </div>
      <button type="button" id="sheet-open" class="rail-settings" title="Settings" aria-label="Settings">
        <!-- Cog path adapted from Lucide (ISC): https://lucide.dev -->
        <svg class="gear" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Settings
      </button>
    </div>
  </aside>

  <!-- Tapping beside the rail closes it; only in the way when it is open. -->
  <div id="rail-scrim" hidden></div>

  <main id="main">
    <header id="topbar">
      <button id="rail-toggle" class="icon" title="Sessions" aria-label="Sessions">☰</button>
      <div class="titles">
        <h1 id="session-title">—</h1>
        <span id="session-folder"></span>
      </div>
      <!-- The policy picker lives here on a wide screen and in the sheet on a
          narrow one. app.js moves this very element, so there is only ever one.
          Mode and model live in the composer instead, as Cursor's chat box has
          them — they belong to the message you are about to write. -->
      <span id="topbar-controls">
        <select id="policy" title="Approval policy" aria-label="Approval policy">
          <option value="ask">Ask every time</option>
          <option value="ask-on-write">Ask before writes</option>
          <option value="auto">Auto-approve</option>
        </select>
      </span>
      <span id="status" class="chip">idle</span>
      <button id="browser-toggle" class="icon desk-only" title="Browser" aria-label="Browser" aria-pressed="false">◉</button>
      <button id="term-toggle" class="icon desk-only" title="Terminals" aria-label="Terminals" aria-pressed="false">▤</button>
    </header>

    <div class="scroller">
      <!-- Visible before JS runs: a long transcript takes a few seconds to
          replay, and an empty pane reads as the app having frozen. -->
      <div id="transcript-loading" class="transcript-loading" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading conversation…</span>
      </div>
      <div id="transcript" aria-busy="true"></div>
      <button id="to-bottom" title="Jump to newest" aria-label="Jump to newest" hidden>↓</button>
    </div>

    <footer id="composer">
      <!-- Messages waiting for the turn to end, as the IDE shows them. -->
      <details id="queue" hidden>
        <summary><span id="queue-count"></span></summary>
        <div id="queue-list"></div>
      </details>
      <!-- One field, with its buttons inside it and its pickers beneath, the
          way Cursor's own chat box carries them. Pasted images sit in here
          too — above the text, still inside the same border. -->
      <div class="composer-box" data-mode="agent">
        <div id="attachments" hidden></div>
        <div class="composer-main">
          <textarea id="box" rows="2" placeholder="Message the agent…"></textarea>
          <button id="stop" class="in-box stop" title="Stop" aria-label="Stop" hidden>■</button>
          <button id="send" class="in-box send" title="Send" aria-label="Send">↑</button>
        </div>
        <div class="composer-controls">
          <select id="mode" title="Agent mode" aria-label="Agent mode">
            <option value="agent">Agent</option>
            <option value="plan">Plan</option>
            <option value="debug">Debug</option>
            <option value="multitask">Multitask</option>
            <option value="ask">Ask</option>
          </select>
          <select id="model" title="Model" aria-label="Model"></select>
          <div class="composer-actions">
            <button id="usage" class="in-box usage" type="button" title="Usage" aria-label="Usage" hidden>
              <span class="usage-dial" aria-hidden="true"></span>
            </button>
            <button id="attach" class="in-box attach" title="Attach image" aria-label="Attach image">+</button>
          </div>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden />
    </footer>
  </main>

  <!-- Browser and terminals share one place: a right dock on a wide screen,
       a full-screen sheet on a phone. Only one tool is visible at a time. -->
  <aside id="workspace" hidden>
    <div class="workspace-bar">
      <div class="workspace-tabs" role="tablist" aria-label="Workspace">
        <button type="button" id="ws-tab-browser" class="workspace-tab" role="tab"
                aria-selected="false" aria-controls="browser">Browser</button>
        <button type="button" id="ws-tab-terminals" class="workspace-tab" role="tab"
                aria-selected="false" aria-controls="terminals">Terminals</button>
      </div>
      <button id="workspace-hide" class="icon" title="Close workspace" aria-label="Close workspace">×</button>
    </div>

    <section id="browser" hidden role="tabpanel" aria-labelledby="ws-tab-browser">
      <div class="browser-bar">
        <button id="browser-back" class="icon" title="Back">‹</button>
        <button id="browser-forward" class="icon" title="Forward">›</button>
        <button id="browser-reload" class="icon" title="Reload">⟳</button>
        <input id="browser-url" type="url" inputmode="url" autocomplete="off"
               spellcheck="false" placeholder="Search or enter address" />
        <span id="browser-spinner" class="spinner" hidden></span>
      </div>
      <div class="browser-view">
        <img id="browser-frame" alt="Browser view" draggable="false" />
        <textarea id="browser-keys" aria-label="Browser keyboard"
                  autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>
    </section>

    <section id="terminals" hidden role="tabpanel" aria-labelledby="ws-tab-terminals">
      <div class="term-bar">
        <div id="term-tabs"></div>
        <button id="term-new" class="icon" title="New terminal">+</button>
      </div>
      <div id="term-panes"></div>
    </section>
  </aside>
</div>

<!-- Everything that is not the conversation. Tapping the backdrop closes it. -->
<div id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="sheet-head">
      <span>Settings</span>
      <button id="sheet-close" class="icon" title="Close" aria-label="Close settings">×</button>
    </div>

    <section class="sheet-block">
      <h2>Session</h2>
      <div class="sheet-row">
        <input id="rename" type="text" placeholder="Session name" aria-label="Session name" />
        <button id="rename-save">Rename</button>
      </div>
      <div class="sheet-row" id="sheet-controls"></div>
      <div class="sheet-note mono" id="sheet-folder"></div>
    </section>

    <section class="sheet-block">
      <h2>Appearance</h2>
      <div class="seg" id="theme-seg" role="group" aria-label="Theme">
        <button data-theme-choice="system" aria-pressed="true">System</button>
        <button data-theme-choice="light" aria-pressed="false">Light</button>
        <button data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </section>

    <section class="sheet-block">
      <h2>Panels</h2>
      <div class="sheet-row">
        <button id="sheet-browser">Browser</button>
        <button id="sheet-terminals">Terminals</button>
      </div>
    </section>

    <section class="sheet-block" id="install-block" hidden>
      <h2>Home Screen</h2>
      <div class="sheet-row" id="install-row" hidden>
        <button type="button" id="install-app">Add to Home Screen</button>
      </div>
      <div class="sheet-note" id="install-note"></div>
    </section>

    <section class="sheet-block">
      <h2>Host</h2>
      <div class="sheet-row">
        <button id="sheet-sync">Refresh sessions</button>
        <button id="restart" class="danger">Restart Auto</button>
      </div>
      <div class="sheet-note" id="sheet-conn"></div>
    </section>
  </div>
</div>

<!-- Starting a session means choosing where it works: the projects Cursor
    knows, or a folder typed in by hand. -->
<div id="newbie" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="New session">
    <div class="sheet-head">
      <span>New session</span>
      <button id="newbie-close" class="icon" title="Close" aria-label="Close">×</button>
    </div>
    <section class="sheet-block">
      <h2>Project</h2>
      <div class="sheet-row">
        <input id="newbie-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" />
      </div>
      <div id="newbie-list"></div>
      <div class="sheet-row">
        <input id="newbie-path" type="text" placeholder="Or a folder path…" aria-label="Folder path" />
        <button id="newbie-create">Create</button>
      </div>
      <div class="sheet-note" id="newbie-note"></div>
    </section>
  </div>
</div>

<!-- Context fill for this chat, plus account-wide Cursor usage. -->
<div id="usage-sheet" hidden>
  <div class="sheet-panel usage-panel" role="dialog" aria-modal="true" aria-label="Usage">
    <div class="sheet-head">
      <span>Usage</span>
      <button id="usage-close" class="icon" title="Close" aria-label="Close usage">×</button>
    </div>
    <div id="usage-body" class="usage-body">
      <div class="sheet-note">Loading…</div>
    </div>
  </div>
</div>

<!-- Full-size image viewer: pinch / wheel to zoom, drag to pan. -->
<div id="lightbox" hidden>
  <button type="button" id="lightbox-close" class="icon" title="Close" aria-label="Close image">×</button>
  <div id="lightbox-stage">
    <img id="lightbox-img" alt="" draggable="false" />
  </div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>

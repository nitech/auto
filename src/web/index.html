<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>Auto</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/style.css" />
<script>
  // Before first paint, so a light-theme phone never flashes a dark page.
  try {
    const pref = localStorage.getItem('auto.theme') || 'system';
    const light = pref === 'light'
      || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="rail-head">
      <span class="brand">Auto</span>
      <button id="new-session" class="icon" title="New session">+</button>
      <button id="rail-close" class="icon" title="Close sessions" aria-label="Close sessions">×</button>
    </div>
    <div id="session-list"></div>
    <div class="rail-foot">
      <div class="rail-status">
        <span id="conn" class="dot"></span><span id="conn-label">connecting</span>
      </div>
      <button type="button" id="sheet-open" class="rail-settings" title="Settings" aria-label="Settings">
        <span class="gear" aria-hidden="true"></span>
        Settings
      </button>
    </div>
  </aside>

  <!-- Tapping beside the rail closes it; only in the way when it is open. -->
  <div id="rail-scrim" hidden></div>

  <main id="main">
    <header id="topbar">
      <button id="rail-toggle" class="icon" title="Sessions" aria-label="Sessions">☰</button>
      <div class="titles">
        <h1 id="session-title">—</h1>
        <span id="session-folder"></span>
      </div>
      <!-- The policy picker lives here on a wide screen and in the sheet on a
          narrow one. app.js moves this very element, so there is only ever one.
          Mode and model live in the composer instead, as Cursor's chat box has
          them — they belong to the message you are about to write. -->
      <span id="topbar-controls">
        <select id="policy" title="Approval policy" aria-label="Approval policy">
          <option value="ask">Ask every time</option>
          <option value="ask-on-write">Ask before writes</option>
          <option value="auto">Auto-approve</option>
        </select>
      </span>
      <span id="status" class="chip">idle</span>
      <button id="browser-toggle" class="icon desk-only" title="Browser" aria-label="Browser">◉</button>
      <button id="term-toggle" class="icon desk-only" title="Terminals" aria-label="Terminals">▤</button>
    </header>

    <section id="browser" hidden>
      <div class="browser-bar">
        <button id="browser-back" class="icon" title="Back">‹</button>
        <button id="browser-forward" class="icon" title="Forward">›</button>
        <button id="browser-reload" class="icon" title="Reload">⟳</button>
        <input id="browser-url" type="url" inputmode="url" autocomplete="off"
               spellcheck="false" placeholder="Search or enter address" />
        <span id="browser-spinner" class="spinner" hidden></span>
        <button id="browser-hide" class="icon" title="Hide browser">▾</button>
      </div>
      <div class="browser-view">
        <img id="browser-frame" alt="Browser view" draggable="false" />
        <textarea id="browser-keys" aria-label="Browser keyboard"
                  autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>
    </section>

    <div class="scroller">
      <!-- Visible before JS runs: a long transcript takes a few seconds to
          replay, and an empty pane reads as the app having frozen. -->
      <div id="transcript-loading" class="transcript-loading" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading conversation…</span>
      </div>
      <div id="transcript" aria-busy="true"></div>
      <button id="to-bottom" title="Jump to newest" aria-label="Jump to newest" hidden>↓</button>
    </div>

    <section id="terminals" hidden>
      <div class="term-bar">
        <div id="term-tabs"></div>
        <button id="term-new" class="icon" title="New terminal">+</button>
        <button id="term-hide" class="icon" title="Hide terminals">▾</button>
      </div>
      <div id="term-panes"></div>
    </section>

    <footer id="composer">
      <!-- Messages waiting for the turn to end, as the IDE shows them. -->
      <details id="queue" hidden>
        <summary><span id="queue-count"></span></summary>
        <div id="queue-list"></div>
      </details>
      <div id="attachments" hidden></div>
      <!-- One field, with its buttons inside it and its pickers beneath, the
          way Cursor's own chat box carries them. -->
      <div class="composer-box" data-mode="agent">
        <div class="composer-main">
          <textarea id="box" rows="2" placeholder="Message the agent…"></textarea>
          <button id="stop" class="in-box stop" title="Stop" aria-label="Stop" hidden>■</button>
          <button id="send" class="in-box send" title="Send" aria-label="Send">↑</button>
        </div>
        <div class="composer-controls">
          <select id="mode" title="Agent mode" aria-label="Agent mode">
            <option value="agent">Agent</option>
            <option value="plan">Plan</option>
            <option value="debug">Debug</option>
            <option value="multitask">Multitask</option>
            <option value="ask">Ask</option>
          </select>
          <select id="model" title="Model" aria-label="Model"></select>
          <button id="attach" class="in-box attach" title="Attach image" aria-label="Attach image">+</button>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden />
    </footer>
  </main>
</div>

<!-- Everything that is not the conversation. Tapping the backdrop closes it. -->
<div id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="sheet-head">
      <span>Settings</span>
      <button id="sheet-close" class="icon" title="Close" aria-label="Close settings">×</button>
    </div>

    <section class="sheet-block">
      <h2>Session</h2>
      <div class="sheet-row">
        <input id="rename" type="text" placeholder="Session name" aria-label="Session name" />
        <button id="rename-save">Rename</button>
      </div>
      <div class="sheet-row" id="sheet-controls"></div>
      <div class="sheet-note mono" id="sheet-folder"></div>
    </section>

    <section class="sheet-block">
      <h2>Appearance</h2>
      <div class="seg" id="theme-seg" role="group" aria-label="Theme">
        <button data-theme-choice="system" aria-pressed="true">System</button>
        <button data-theme-choice="light" aria-pressed="false">Light</button>
        <button data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </section>

    <section class="sheet-block">
      <h2>Panels</h2>
      <div class="sheet-row">
        <button id="sheet-browser">Browser</button>
        <button id="sheet-terminals">Terminals</button>
      </div>
    </section>

    <section class="sheet-block">
      <h2>Host</h2>
      <div class="sheet-row">
        <button id="sheet-sync">Refresh sessions</button>
        <button id="restart" class="danger">Restart Auto</button>
      </div>
      <div class="sheet-note" id="sheet-conn"></div>
    </section>
  </div>
</div>

<!-- Starting a session means choosing where it works: the projects Cursor
    knows, or a folder typed in by hand. -->
<div id="newbie" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="New session">
    <div class="sheet-head">
      <span>New session</span>
      <button id="newbie-close" class="icon" title="Close" aria-label="Close">×</button>
    </div>
    <section class="sheet-block">
      <h2>Project</h2>
      <div class="sheet-row">
        <input id="newbie-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" />
      </div>
      <div id="newbie-list"></div>
      <div class="sheet-row">
        <input id="newbie-path" type="text" placeholder="Or a folder path…" aria-label="Folder path" />
        <button id="newbie-create">Create</button>
      </div>
      <div class="sheet-note" id="newbie-note"></div>
    </section>
  </div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>

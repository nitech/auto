<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0b0d12" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Auto" />
<title>Auto</title>
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Three tags cover every browser: .ico for old ones and Safari, the SVG for
     modern tabs, the PNG for iOS. Paths stay clean — `?v=` is for css/js. -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/style.css" />
<style>
  /* Wins over a cached style.css. iOS reports ~80px of bottom inset on a Home
     Screen app; the layout viewport already ends above the home bar / keyboard. */
  html[data-standalone] #composer { padding-bottom: 8px !important; }
  /* Mode/model draw at 12px in the installed PWA, where maximum-scale=1 makes
     focus-zoom impossible — see style.css. A cached sheet must not resurrect
     the old zoom: 0.75 trick or leave transform: scale on the pickers group. */
  html[data-standalone] .composer-pickers {
    transform: none !important;
    gap: 4px !important;
  }
  html[data-standalone] .composer-controls select {
    font-size: 12px !important;
    zoom: normal !important;
    transform: none !important;
    max-width: 12rem !important;
  }
</style>
<script>
  // Before first paint, so a light-theme phone never flashes a dark page,
  // and an installed app does not lay out at 100dvh (too tall on iOS).
  try {
    const pref = localStorage.getItem('auto.theme') || 'system';
    const light = pref === 'light'
      || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    const theme = document.querySelector('meta[name="theme-color"]');
    if (theme) theme.setAttribute('content', light ? '#ffffff' : '#0b0d12');
    const standalone = navigator.standalone
      || matchMedia('(display-mode: standalone)').matches;
    if (standalone) {
      document.documentElement.dataset.standalone = '';
      // Home Screen apps: stop iOS focus-zoom on the mode/model <select>s.
      // Pinch-zoom is rarely useful in a chat PWA; maximum-scale locks it.
      const vp = document.querySelector('meta[name="viewport"]');
      if (vp) {
        vp.setAttribute(
          'content',
          'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content',
        );
      }
    }
    const vv = window.visualViewport;
    if (vv) {
      document.documentElement.style.setProperty('--vv-top', `${Math.round(vv.offsetTop)}px`);
      document.documentElement.style.setProperty('--vv-height', `${Math.round(vv.height)}px`);
    }
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="rail-head">
      <svg class="brand-mark" viewBox="96 88 320 328" aria-hidden="true">
        <path d="M140 372 L256 132" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round"/>
        <path d="M372 372 L256 132" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round"/>
        <path d="M230.79 248.5 A28 28 0 0 1 281.21 248.5 L295 155 L217 155 Z" fill="currentColor"/>
        <circle cx="256" cy="372" r="32" fill="var(--usage-accent)"/>
      </svg>
      <span class="brand">
        <span class="brand-name">Auto</span>
        <span class="brand-host">
          <span id="conn" class="dot" role="status" aria-live="polite" title="Connecting…" aria-label="Connecting…"></span>
          <span id="host-label">…</span>
        </span>
      </span>
      <button id="new-session" class="icon" title="New session" aria-label="New session">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/><path d="M12 5v14"/>
        </svg>
      </button>
      <button id="rail-close" class="icon" title="Close sessions" aria-label="Close sessions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div id="session-list"></div>
    <div class="rail-foot">
      <button type="button" id="sheet-open" class="rail-settings" title="Settings" aria-label="Settings">
        <!-- Cog path adapted from Lucide (ISC): https://lucide.dev -->
        <svg class="gear" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Settings
      </button>
    </div>
  </aside>

  <!-- Tapping beside the rail closes it; only in the way when it is open. -->
  <div id="rail-scrim" hidden></div>

  <main id="main">
    <header id="topbar">
      <button id="rail-toggle" class="icon" title="Sessions" aria-label="Sessions">☰</button>
      <div class="titles">
        <h1 id="session-title">—</h1>
        <div class="titles-path">
          <span id="status" class="dot idle" title="idle" role="status" aria-label="idle"></span>
          <span id="session-folder"></span>
        </div>
      </div>
      <!-- The policy picker lives here on a wide screen and in the sheet on a
          narrow one. app.js moves this very element, so there is only ever one.
          Mode and model live in the composer instead, as Cursor's chat box has
          them — they belong to the message you are about to write. -->
      <span id="topbar-controls">
        <select id="policy" title="Approval policy" aria-label="Approval policy">
          <option value="ask">Ask every time</option>
          <option value="ask-on-write">Ask before writes</option>
          <option value="auto">Auto-approve</option>
        </select>
      </span>
      <!-- Paths from Lucide (ISC): https://lucide.dev — app-window, square-terminal -->
      <span class="topbar-tools">
        <button id="browser-toggle" class="icon" title="Browser" aria-label="Browser" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/>
          </svg>
        </button>
        <button id="term-toggle" class="icon" title="Terminals" aria-label="Terminals" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m7 11 2-2-2-2"/><path d="M11 13h4"/>
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          </svg>
        </button>
      </span>
    </header>

    <!-- Chat is always first; browser and each shell open as closable tabs. -->
    <nav id="view-tabs" class="view-tabs" hidden role="tablist" aria-label="Views"></nav>

    <div id="view-chat">
    <div class="scroller">
      <!-- Visible before JS runs: a long transcript takes a few seconds to
          replay, and an empty pane reads as the app having frozen. Same A
          as the rail — not an <img> of icon.svg — so a manual theme pick
          still matches. -->
      <div id="transcript-loading" class="transcript-loading" role="status" aria-live="polite">
        <svg class="brand-mark loading-mark" viewBox="96 88 320 328" aria-hidden="true">
          <path d="M140 372 L256 132" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round"/>
          <path d="M372 372 L256 132" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round"/>
          <path d="M230.79 248.5 A28 28 0 0 1 281.21 248.5 L295 155 L217 155 Z" fill="currentColor"/>
          <circle cx="256" cy="372" r="32" fill="var(--usage-accent)"/>
        </svg>
        <span>Loading conversation…</span>
      </div>
      <div id="transcript" aria-busy="true"></div>
      <button id="to-bottom" title="Jump to newest" aria-label="Jump to newest" hidden>↓</button>
    </div>

    <footer id="composer">
      <!-- Messages waiting for the turn to end, as the IDE shows them. -->
      <details id="queue" hidden>
        <summary><span id="queue-count"></span></summary>
        <div id="queue-list"></div>
      </details>
      <!-- One field, with its buttons inside it and its pickers beneath, the
          way Cursor's own chat box carries them. Pasted images sit in here
          too — above the text, still inside the same border. -->
      <div class="composer-box" data-mode="agent">
        <div id="attachments" hidden></div>
        <div class="composer-main">
          <textarea id="box" rows="2" placeholder="Message the agent…"></textarea>
          <button id="stop" class="in-box stop" title="Stop" aria-label="Stop" hidden>■</button>
          <button id="send" class="in-box send" title="Send" aria-label="Send">↑</button>
        </div>
        <div class="composer-controls">
          <div class="composer-pickers">
            <select id="mode" title="Agent mode" aria-label="Agent mode">
              <option value="agent">Agent</option>
              <option value="plan">Plan</option>
              <option value="debug">Debug</option>
              <option value="multitask">Multitask</option>
              <option value="ask">Ask</option>
            </select>
            <select id="model" title="Model" aria-label="Model"></select>
          </div>
          <div class="composer-actions">
            <button id="usage" class="in-box usage" type="button" title="Usage" aria-label="Usage" hidden>
              <span class="usage-dial" aria-hidden="true"></span>
            </button>
            <button id="attach" class="in-box attach" title="Attach image" aria-label="Attach image">+</button>
          </div>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden />
    </footer>
    </div>

    <section id="browser" hidden role="tabpanel" aria-label="Browser">
      <div class="browser-bar">
        <button id="browser-back" class="icon" title="Back">‹</button>
        <button id="browser-forward" class="icon" title="Forward">›</button>
        <button id="browser-reload" class="icon" title="Reload">⟳</button>
        <input id="browser-url" type="url" inputmode="url" autocomplete="off"
               spellcheck="false" placeholder="Search or enter address" />
        <span id="browser-spinner" class="spinner" hidden></span>
      </div>
      <div class="browser-view">
        <img id="browser-frame" alt="Browser view" draggable="false" />
        <textarea id="browser-keys" aria-label="Browser keyboard"
                  autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>
    </section>

    <section id="terminals" hidden role="tabpanel" aria-label="Terminals">
      <div id="term-panes"></div>
    </section>
  </main>
</div>

<!-- Everything that is not the conversation. Tapping the backdrop closes it. -->
<div id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="sheet-head">
      <span>Settings</span>
      <button id="sheet-close" class="icon" title="Close" aria-label="Close settings">×</button>
    </div>

    <section class="sheet-block">
      <h2>Session</h2>
      <div class="sheet-row">
        <input id="rename" type="text" placeholder="Session name" aria-label="Session name" />
        <button id="rename-save">Rename</button>
      </div>
      <div class="sheet-row" id="sheet-controls"></div>
      <div class="sheet-note mono" id="sheet-folder"></div>
    </section>

    <section class="sheet-block">
      <h2>Appearance</h2>
      <div class="seg" id="theme-seg" role="group" aria-label="Theme">
        <button data-theme-choice="system" aria-pressed="true">System</button>
        <button data-theme-choice="light" aria-pressed="false">Light</button>
        <button data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </section>

    <section class="sheet-block" id="install-block" hidden>
      <h2>Home Screen</h2>
      <div class="sheet-row" id="install-row" hidden>
        <button type="button" id="install-app">Add to Home Screen</button>
      </div>
      <div class="sheet-note" id="install-note"></div>
    </section>

    <section class="sheet-block">
      <h2>Host</h2>
      <div class="sheet-row">
        <input id="host-nick" type="text" placeholder="Display name" aria-label="Host display name" autocomplete="off" />
        <button id="host-nick-save">Save</button>
      </div>
      <div class="sheet-note mono" id="sheet-hostname"></div>
      <div class="sheet-row">
        <button id="sheet-sync">Refresh sessions</button>
        <button id="restart" class="danger">Restart Auto</button>
      </div>
      <div class="sheet-note" id="sheet-conn"></div>
    </section>
  </div>
</div>

<!-- Starting a session means choosing where it works: the projects Cursor
    knows, or a folder typed in by hand. -->
<div id="newbie" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="New session">
    <div class="sheet-head">
      <span>New session</span>
      <button id="newbie-close" class="icon" title="Close" aria-label="Close">×</button>
    </div>
    <section class="sheet-block">
      <h2>Project</h2>
      <div class="sheet-row">
        <input id="newbie-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" />
      </div>
      <div id="newbie-list"></div>
      <div class="sheet-row">
        <input id="newbie-path" type="text" placeholder="Or a folder path…" aria-label="Folder path" />
        <button id="newbie-create">Create</button>
      </div>
      <div class="sheet-note" id="newbie-note"></div>
    </section>
  </div>
</div>

<!-- Context fill for this chat, plus account-wide Cursor usage. -->
<div id="usage-sheet" hidden>
  <div class="sheet-panel usage-panel" role="dialog" aria-modal="true" aria-label="Usage">
    <div class="sheet-head">
      <span>Usage</span>
      <button id="usage-close" class="icon" title="Close" aria-label="Close usage">×</button>
    </div>
    <div id="usage-body" class="usage-body">
      <div class="sheet-note">Loading…</div>
    </div>
  </div>
</div>

<!-- Created Plan markdown — full window, closed with × (or Escape). -->
<div id="plan-sheet" hidden>
  <div class="sheet-panel plan-panel" role="dialog" aria-modal="true" aria-labelledby="plan-sheet-title">
    <div class="sheet-head">
      <span id="plan-sheet-title">Plan</span>
      <button type="button" id="plan-close" class="icon" title="Close" aria-label="Close plan">×</button>
    </div>
    <div id="plan-body" class="plan-body md"></div>
    <div id="plan-foot" class="plan-foot">
      <div class="cap outcome" id="plan-outcome"></div>
      <span class="build-group">
        <button type="button" class="build" id="plan-build">Build</button>
        <select class="build-model" id="plan-build-model" aria-label="Model to build with"></select>
      </span>
    </div>
  </div>
</div>

<!-- Full-size image viewer: pinch / wheel to zoom, drag to pan. -->
<div id="lightbox" hidden>
  <button type="button" id="lightbox-close" class="icon" title="Close" aria-label="Close image">×</button>
  <div id="lightbox-stage">
    <img id="lightbox-img" alt="" draggable="false" />
  </div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>

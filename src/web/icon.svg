<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Auto">
  <title>Auto</title>
  <!--
    Full-bleed field so iOS and Android can apply their own mask. The mark
    stays inside the inner 80% (maskable safe zone). An open ring with a live
    pip at 12 o'clock — Auto is the always-on remote; the circuit closes when
    it is up. Stroke and pip are sized to survive a 16×16 tab. Geometry is
    shared with scripts/raster-icon.mjs.
  -->
  <rect width="512" height="512" fill="#0b0d12"/>
  <path d="M318.22 122.97A144 144 0 1 1 193.78 122.97"
        fill="none" stroke="#6ea8ff" stroke-width="64" stroke-linecap="round"/>
  <circle cx="256" cy="112" r="32" fill="#4ad07f"/>
</svg>

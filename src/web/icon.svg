<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 88 320 328" role="img" aria-label="Auto">
  <title>Auto</title>
  <!--
    Glyph-only tab favicon — transparent field, viewBox cropped to the mark
    (same crop as the rail brand-mark) so it reads at 16px. Home-screen /
    PWA rasters stay on a full 512 dark tile with MARK_SCALE
    (scripts/raster-icon.mjs). Themes with prefers-color-scheme.
  -->
  <style>
    @media (prefers-color-scheme: light) {
      .leg, .fillet { stroke: #131720; }
      .fillet { fill: #131720; }
      .dot { fill: #8a5a00; }
    }
  </style>
  <path class="leg" d="M140 372 L256 132" fill="none" stroke="#dfe3ea" stroke-width="56" stroke-linecap="round"/>
  <path class="leg" d="M372 372 L256 132" fill="none" stroke="#dfe3ea" stroke-width="56" stroke-linecap="round"/>
  <!-- Fillet pad: arc is the hole ceiling; top edge sits buried in the solid. -->
  <path class="fillet" d="M230.79 248.5 A28 28 0 0 1 281.21 248.5 L295 155 L217 155 Z"
        fill="#dfe3ea"/>
  <circle class="dot" cx="256" cy="372" r="32" fill="#e5a95a"/>
</svg>
